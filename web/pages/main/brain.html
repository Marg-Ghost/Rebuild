<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#FFFAED">
        <title>Sleep | Rebuild</title>
        <link rel="stylesheet" href="/static/styles/main.css?v=20261029-feature-alignment">
        <link rel="stylesheet" href="/static/styles/feature-pages.css?v=20261029-anatomy-nav">
    </head>
    <body class="brain-page feature-page brain-feature-page">
        <header class="dashboard-topbar">
            <a class="brand" href="/home" aria-label="Opty overview">
                <img class="brand-mark" src="/static/assets/logo.svg" alt="">
                <span>Rebuild</span>
            </a>
            <nav class="top-navigation" aria-label="Main navigation">
                <a href="/home">Overview</a>
                <a href="/llm">AI assistant</a>
                <a href="/kalender">Calendar</a>
            </nav>
            <div class="user-chip" aria-label="Signed-in user">
                <span class="user-avatar" aria-hidden="true">O</span>
                <span id="dashboard-username">Your space</span>
            </div>
        </header>

        <main class="brain-dashboard">
            <section class="brain-visual" aria-label="Sleep and brain">
                <div class="brain-halo brain-halo-outer" aria-hidden="true"></div>
                <div class="brain-halo brain-halo-inner" aria-hidden="true"></div>
                <img class="brain-silhouette" src="/static/assets/body.svg" alt="">
                <img class="brain-sleep-icon" src="/static/assets/sleep.svg" alt="Sleep">
            </section>

            <section class="brain-data" aria-label="Your sleep data">
                <div class="brain-sleep-summary">
                    <div class="brain-sleep-value">
                        <strong id="brain-sleep-hours">--</strong>
                        <span>h</span>
                    </div>
                    <span class="brain-today-label">today</span>
                </div>
                <div class="brain-midnight-value">
                    <span>After midnight:</span>
                    <strong id="brain-late-nights">--/7</strong>
                </div>

                <section class="brain-counter-card" aria-labelledby="brain-counter-title">
                    <div class="brain-counter-value" id="brain-sleep-counter">--</div>
                    <h1 id="brain-counter-title">Sleep counter</h1>
                    <svg class="brain-history-chart" id="brain-history-chart" viewBox="0 0 360 100" role="img" aria-label="Sleep quality over the last seven check-ins">
                        <path class="brain-chart-line" id="brain-chart-line" d=""></path>
                    </svg>
                    <p class="brain-history-caption" id="brain-history-caption">Your history will appear after your first check-ins.</p>
                </section>
                <p class="brain-status" id="brain-status" role="status" aria-live="polite"></p>
            </section>
        </main>
        <script src="/static/feature-nav.js?v=20261029-english-ui"></script>
        <script src="/static/brain.js?v=20261029-english-ui"></script>
    </body>
</html>
