<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="/static/styles/main.css">
    </head>
    <body>
        <nav id="navbar">
            <figure>
                <img alt="ai">
                <p>AI-Assitant</p>
            </figure>
            <figure>
                <img alt="Kalender">
                <p>Kalender</p>
            </figure>
            <figure>
                <img alt="Profile">
                <p>Profile</p>
            </figure>
        </nav>
        <section id="nav_menu">
            <figure>
                <img src="/static/assets/body.svg"/>
            </figure>
            <button onclick="navigateToFeature('/brain')" class="select" id="brain" type="button" data-label="Brain" aria-label="Brain">b</button>
            <button onclick="navigateToFeature('/stomach')" class="select" id="stomach" type="button" data-label="Stomach" aria-label="Stomach">s</button>
            <button onclick="navigateToFeature('/activity')" class="select" id="activity" type="button" data-label="Activity" aria-label="Activity">a</button>
        </section>
        <main>
            <section id="checkup">
                <div id="checkupcount" class="piecharm"></div>
                <p>Checkup<span id="checkupwert_today">10/10</span></p>
                <p id="sleep_checkup_today">Schlaf-Check-in wird geladen ...</p>
                <button id="start-checkup" type="button" onclick="navigateToFeature('/checkup')">Start Checkup</button>
            </section>
            <section id="health">
                <h3 id="health_count">1010</h3>
                <p>Health points</p>
                <div id="graph"></div>
            </section>
            <section id="menu-bar">
                <section id="recomenden">
                    <img alt="ai"/>
                    <p>You sould work more</p>
                </section>
                <section id="Kalender">
                    <img alt="kalender"/>
                    <p>ImportantTasks : <span>10</span></p>
                </section>
                <section id="effecency">
                    <p>Efficency after last checkup</p>
                    <div class="piecharm"id="effincy_graph"></div>
                    <h3 id="Effincynumber">100</h3>
                </section>
            </section>
        </main>
        <script src="/static/index.js"></script>
    </body>
</html>
