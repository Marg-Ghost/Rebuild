<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#FFFAED">
        <title>Activity | Rebuild</title>
        <link rel="stylesheet" href="/static/styles/main.css?v=20261029-feature-alignment">
        <link rel="stylesheet" href="/static/styles/feature-pages.css?v=20261029-smaller-halos">
    </head>
    <body class="brain-page feature-page food-page">
        <header class="dashboard-topbar">
            <a class="brand" href="/home" aria-label="Opty overview">
                <img class="brand-mark" src="/static/assets/logo.svg" alt="">
                <span>Rebuild</span>
            </a>
            <nav class="top-navigation" aria-label="Main navigation">
                <a href="/home">Overview</a>
                <a href="/llm">AI assistant</a>
                <a href="/kalender">Calendar</a>
            </nav>
            <div class="user-chip" aria-label="Signed-in user">
                <span class="user-avatar" aria-hidden="true">O</span>
                <span id="dashboard-username">Your space</span>
            </div>
        </header>

        <main class="food-dashboard">
            <section class="food-visual activity-visual" aria-label="Activity">
                <div class="brain-halo brain-halo-outer" aria-hidden="true"></div>
                <div class="brain-halo brain-halo-inner" aria-hidden="true"></div>
                <img class="food-silhouette activity-silhouette" src="/static/assets/body.svg" alt="">
                <img class="food-organ-icon activity-icon" src="/static/assets/activity.svg" alt="Activity">
            </section>

            <section class="food-data" aria-label="Your activity check-ins">
                <section class="brain-counter-card food-counter-card" aria-labelledby="activity-counter-title">
                    <div class="brain-counter-value" id="activity-counter-value">--</div>
                    <h1 id="activity-counter-title">Activity score today</h1>
                    <svg class="brain-history-chart food-history-chart" viewBox="0 0 360 100" role="img" aria-label="Activity score history for the last seven days">
                        <path class="brain-chart-line" id="activity-chart-line" d=""></path>
                    </svg>
                    <p class="brain-history-caption" id="activity-history-caption">Your activity history will appear after your first check-ins.</p>
                </section>

                <section class="food-entries-section" aria-labelledby="activity-entries-title">
                    <h1 id="activity-entries-title">All entries</h1>
                    <div class="food-entry-list" id="activity-entry-list" aria-live="polite">
                        <p class="food-empty-state">Loading entries ...</p>
                    </div>
                </section>
                <p class="brain-status" id="activity-status" role="status" aria-live="polite"></p>
            </section>
        </main>
        <script src="/static/feature-nav.js?v=20261029-english-ui"></script>
        <script src="/static/activity.js?v=20261029-english-ui"></script>
    </body>
</html>
