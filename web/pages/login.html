<!DOCTYPE html>
<html>
    <head>
        <title>Checkup</title>
    </head>
    <body>
        <main>

            <section id="auth" class="auth-panel">
                <div id="login" class="auth-mode">
                    <div id="login_message">
                        <h1>Login</h1>
                        <p>Login mit genau einem Identifikator.</p>
                    </div>

                    <fieldset>
                        <legend>Login mit</legend>
                        <label>
                            <input type="radio" name="login_method" value="username" checked onchange="updateLoginFields()" />
                            Benutzername
                        </label>
                        <label>
                            <input type="radio" name="login_method" value="email" onchange="updateLoginFields()" />
                            E-Mail
                        </label>
                        <label>
                            <input type="radio" name="login_method" value="phone" onchange="updateLoginFields()" />
                            Telefonnummer
                        </label>
                    </fieldset>
                    <input type="text" id="username_input" placeholder="Benutzername" required />
                    <input type="email" id="email_input" placeholder="E-Mail-Adresse" hidden />
                    <input type="tel" id="phone_input" placeholder="Telefonnummer" hidden />
                    <input type="password" id="pwd_input" placeholder="Passwort" required />
                    <button onclick="loginUser()">Login</button>
                    <p id="login_status" aria-live="polite"></p>
                    <p>Du hast noch kein Konto? <button type="button" onclick="load_r_or_l('register')">Registrieren</button></p>
                </div>

                <div id="register" class="auth-mode" hidden>
                    <div id="register_message">
                        <h1>Register</h1>
                        <p>Erstelle ein neues Konto.</p>
                    </div>

                    <input type="text" id="usr_input_reg" placeholder="Benutzername" />
                    <input type="email" id="email_input_reg" placeholder="E-Mail-Adresse (Pflichtfeld)" required />
                    <input type="tel" id="phone_input_reg" placeholder="Telefonnummer (optional)" />
                    <input type="password" id="pwd_input_reg" placeholder="Passwort" required />
                    <button onclick="registerUser()">Register</button>
                    <p>Du hast bereits ein Konto? <button type="button" onclick="load_r_or_l('login')">Zum Login</button></p>
                </div>
            </section>
        </main>
        <script src="/main.js"></script>
    </body>
</html>
