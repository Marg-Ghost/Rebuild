<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kalender</title>
        <link rel="stylesheet" href="/static/styles/calendar.css">
    </head>
    <body>
        <main id="current_month">
            <section id="month_current" aria-label="Monatsansicht">
                <button id="last" type="button" aria-label="Vorheriger Monat" onclick="change_calendar_month(-1)">&lt;</button>
                <h1 id="month_label"></h1>
                <button id="next" type="button" aria-label="Nächster Monat" onclick="change_calendar_month(1)">&gt;</button>
            </section>
            <section id="table">
                <table id="show_month">
                    <thead>
                        <tr>
                            <th>Mo</th><th>Di</th><th>Mi</th><th>Do</th>
                            <th>Fr</th><th>Sa</th><th>So</th>
                        </tr>
                    </thead>
                    <tbody id="calendar_days"></tbody>
                </table>
            </section>
            <div id="interaction">
                <button id="toggle_add_button" type="button" onclick="toggle_add()">Add Task</button>
            </div>
        </main>

        <section id="add_date" hidden>
            <h2>Add to Agenda</h2>
            <form id="task_form" onsubmit="set_data(event)">
                <label>Datum <input id="date" type="date" required></label>
                <label>Uhrzeit <input id="time" type="time"></label>
                <label>Wichtigkeit
                    <input id="slider" type="range" min="1" max="4" step="1" value="1" oninput="update_importance(this.value)">
                    <output id="sliderOutput">1</output>
                </label>
                <label>Typ
                    <select id="type_select">
                        <option value="work">Work</option>
                        <option value="private">Private</option>
                    </select>
                </label>
                <label>Inhalt <input id="content" type="text" placeholder="Task..."></label>
                <button type="submit">Hinzufügen</button>
            </form>
        </section>
        <p id="calendar_status" role="status" aria-live="polite"></p>
        <script src="/kalender-static/kalender.js"></script>
    </body>
</html>
