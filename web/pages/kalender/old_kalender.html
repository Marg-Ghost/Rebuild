<!THUCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar</title>
        <link rel="stylesheet" href="/static/styles/calendar.css">
    </head>
    <body>
        <nav id="navbar">
            <figure>
                <img alt="ai">
                <p>AI-Assitant</p>
            </figure>
            <figure>
                <img alt="Calendar">
                <p>Calendar</p>
            </figure>
            <figure>
                <img alt="Profile">
                <p>Profile</p>
            </figure>
        </nav>
        <main>
            <section id="current_date">
                <p id="day_number"><span>01</span> |</p>
                <p id="day">Mo</p>
            </section>
            <section id="task_date">
                <div id="priority_5">
                    <p >Important</p>
                </div>
                <div id="priority_4">
                    <p >High</p>
                </div>
                <div id="priority_3">
                    <p >Medium</p>
                </div>
                <div id="priority_2">
                    <p >Low</p>
                </div>
                <div id="priority_1">
                    <p >Trivial</p>
                </div>
            </section>
            <section id="month_current">
                <button id="previous_month" type="button" aria-label="Previous month">&lt;</button>
                <p id="month_date"><span>01</span> |</p>
                <p id="month">Januaryy</p>
                <button id="next_month" type="button" aria-label="Next month">&gt;</button>
            </section>
            <form id="event_form">
                <input id="event_title" type="text" placeholder="Termin" required>
                <input id="event_start" type="date" required>
                <select id="event_priority">
                    <option value="5">Important</option>
                    <option value="4">High</option>
                    <option value="3" selected>Medium</option>
                    <option value="2">Low</option>
                    <option value="1">Trivial</option>
                </select>
                <button type="submit">Add</button>
            </form>
            <section id="table">
                <table>
                    <thead>
                        <tr>
                        <th>MONN</th>
                        <th>TUE</th>
                        <th>WED</th>
                        <th>THU</th>
                        <th>FRII</th>
                        <th>SATT</th>
                        <th>SUN</th>
                        </tr>
                    </thead>
                    <tbody id="calendar_body"></tbody>
                    </table>
            </section>
        </main>
        <script src="/static/calendar.js"></script>
    </body>
</html>
