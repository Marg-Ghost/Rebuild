<!DOCTYPE html>
<html>
    <head>
        <meta>
    </head>
    <body>
        <main id="current_month">
            <div class="button">
                <button id="last">last month</button>
                <button id="next">next month</button>
            </div>
            <table id="show_month">
                <tr>
                    <th>Mo</th>
                    <th>Di</th>
                    <th>Mi</th>
                    <th>Do</th>
                    <th>Fr</th>
                    <th>Sa</th>
                    <th>So</th>
                </tr>
            </table>
            <div id="interaction">
                <button onclick="toggle_add()">add Task</button>
            </div>
        </main>

        <section id="add_date" style="display: none;">
            <h1>Add to Agenda</h1>
            <div>
                <h3>Date and Time*</h3>
                <input id="date" type="date"/>
                <input id="time" type="time"/>

                <h3>Importance*</h3>
                <input type="range" id="slider" min="1" max="4" step="1" value="1" oninput="sliderOutput.value = this.value">
                <output id="sliderOutput">1</output>

                <h3>Type*</h3>
                <select name="type" id="type_select">
                    <option value="work">Work</option>
                    <option value="private">Private</option>
                </select>

                <h3>Content(recomended)</h3>
                <input id="content" type="text" placeholder="Task..."/>

                <input onclick="set_data()" type="submit"/>
            </div>
        </section>
        <script src="kalender.js"></script>
</html>
