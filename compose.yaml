services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      SessionMiddlewareSecretKey: ${SessionMiddlewareSecretKey:-}
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./data/user:/app/data/user
      - ./data/ai_konstanten:/app/data/ai_konstanten
      - ./core/ai:/app/core/ai
      - ./Kalender/data:/app/Kalender/data
      - ./llm-support/data:/app/llm-support/data
      - ./chroma_data:/app/chroma_data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://0.0.0.0:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama_data:
